[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-qa-system"
version = "0.1.0"
description = "Production-style RAG document Q&A system with FastAPI, LangChain, Chroma, and pluggable LLM providers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sasidhar Appalla" }]

dependencies = [
    # API layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Persistence
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",

    # LangChain + retrieval stack
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-chroma>=0.1.4",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pypdf>=4.3",

    # LLM SDKs (raw — LangChain for orchestration only)
    "openai>=1.40",
    "anthropic>=0.34",
    "tenacity>=8.2",

    # Observability
    "prometheus-client>=0.20",

    # Config / misc
    "python-dotenv>=1.0",

    # Sample PDF generation (used by scripts/ and tests)
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-requests",
]

[project.scripts]
rag-generate-samples = "scripts.generate_samples:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
# B008: Depends()/File() in default args is the idiomatic FastAPI pattern.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
